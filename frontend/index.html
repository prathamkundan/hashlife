<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conway's Game of Life</title>
  </head>

  <body>
    <div class="tooltip">
      <div class="tooltiptext">
      I/E - Toggle Edit <br>
      Shift-R - Reset (In edit)<br>
      Esc - Enter Pan Mode<br>
      Space - Play/Pause<br>
      </div>
      <div class="info-icon">i</div>
    </div>
    <div class="hud">
      <div class="stats-display" id="sim-stats"></div>
      <div class="mode-buttons" id="mode-buttons">
        <button id="mode-pan" class="mode-btn active">Pan</button>
        <button id="mode-edit" class="mode-btn">Edit</button>
        <button id="mode-play" class="mode-btn">▶</button>
      </div>
      <div class="advance-control">
        <input id="step-amount" type="number" min="1" value="1" />
        <button id="step-btn">Advance</button>
      </div>
    </div>
    <div id="canvas-container">
      <canvas id="game-of-life-canvas"></canvas>
    </div>
  </body>
</html>
